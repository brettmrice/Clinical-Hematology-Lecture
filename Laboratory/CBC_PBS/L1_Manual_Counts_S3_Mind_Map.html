      left: 24px;

      font-size: 13.5px;
      width: 290px;
      outline: none;
      transition: all 0.25s ease;
      background: transparent;
    }

      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
      width: 350px;
    }

    .search-box svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      width: 16px;
      height: 16px;
      pointer-events: none;
    }

    /* Top Right Floating Cards */
    .top-collapse-card {
      top: 20px;
      right: 24px;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      color: #475569;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .top-expand-card {
      top: 68px;
      right: 24px;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      color: #475569;
      transition: all 0.2s ease;
      white-space: nowrap;

      color: #0f172a;
      border-color: #cbd5e1;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);

    #viewport {
      width: 100vw;
      height: 100vh;
      cursor: grab;
      position: absolute;
      top: 0;
      left: 0;
    }

    #viewport:active {
      cursor: grabbing;
    }

    #mindmap-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    #nodes-container {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
    }

    /* Smooth animated transitions for pan & zoom */
    .animated-transform {
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    /* Node Styles - High contrast crisp typography */
    .node {
      position: absolute;
      display: inline-flex;
      align-items: center;
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      transform: translateY(-50%);
      pointer-events: auto;
      border: 1.5px solid transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .node:hover {
      transform: translateY(-50%) scale(1.04);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14);
      z-index: 5;
    }

    /* Indicator: '+' if collapsed, '-' if expanded, none if no children */
    .node.has-children.collapsed::after {
      content: '+';
      display: inline-block;
      font-family: monospace;
      font-size: 14px;
      font-weight: 700;
      margin-left: 8px;
      opacity: 0.9;
    }

    .node.has-children:not(.collapsed)::after {
      content: '−';
      display: inline-block;
      font-family: monospace;
      font-size: 14px;
      font-weight: 700;
      margin-left: 8px;
      opacity: 0.9;
    }

    /* Exact Node Match Highlight */
    .node.highlighted {
      animation: pulseHighlight 1.5s infinite alternate;
    }

    /* Collapsed Parent contains matching children highlight */
    .node.parent-match-highlighted {
      animation: pulseParentHighlight 1.5s infinite alternate;
      border-color: #d97706 !important;
    }

    @keyframes pulseHighlight {
      0% { box-shadow: 0 0 0 2px #d97706; }
      100% { box-shadow: 0 0 0 8px rgba(217, 119, 6, 0); }
    }

    @keyframes pulseParentHighlight {
      0% { box-shadow: 0 0 0 3px #d97706, 0 0 12px rgba(217, 119, 6, 0.4); }
      100% { box-shadow: 0 0 0 7px rgba(217, 119, 6, 0.2), 0 0 4px rgba(217, 119, 6, 0.1); }

    // State Variables
    let scale = 1.0;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startX, startY;
    
    let collapsedNodes = new Set();
    function setInitialCollapsedState(node) {
      if (node.level >= 1 && node.children && node.children.length > 0) {
        collapsedNodes.add(node.id);
      }
      if (node.children) {
        node.children.forEach(setInitialCollapsedState);
      }
    }
    setInitialCollapsedState(mindMapData);

    const LEVEL_X_GAP = 320;
    const NODE_Y_GAP = 54;

    const viewport = document.getElementById('viewport');
    const nodesContainer = document.getElementById('nodes-container');
    const svgPathsGroup = document.getElementById('svg-paths-group');

    // --- LAYOUT ENGINE ---
    function computeVerticalLayout(node, depth = 0, yOffset = { val: 0 }) {
      node.depth = depth;

      const isCollapsed = collapsedNodes.has(node.id);
      const visibleChildren = (!isCollapsed && node.children) ? node.children : [];

      if (visibleChildren.length === 0) {
        node.y = yOffset.val;
        yOffset.val += NODE_Y_GAP;
      } else {
        const childYs = [];
        visibleChildren.forEach(child => {
          computeVerticalLayout(child, depth + 1, yOffset);
          childYs.push(child.y);
        });
        node.y = (childYs[0] + childYs[childYs.length - 1]) / 2;
      }
    }

    function computeHorizontalLayout(node, currentX = 0) {
      node.x = currentX;

      const isCollapsed = collapsedNodes.has(node.id);
      const visibleChildren = (!isCollapsed && node.children) ? node.children : [];

      if (visibleChildren.length > 0) {
        const nodeWidth = node.domEl ? (node.domEl.getBoundingClientRect().width / scale) : 220;
        const nextX = currentX + Math.max(LEVEL_X_GAP, nodeWidth + 60);
        visibleChildren.forEach(child => {
          computeHorizontalLayout(child, nextX);
        });
      }
    }

    function flattenNodes(node, list = []) {
      list.push(node);
      const isCollapsed = collapsedNodes.has(node.id);
      if (!isCollapsed && node.children) {
        node.children.forEach(child => flattenNodes(child, list));
      }
      return list;
    }

    let isInitialLoad = true;

    function renderMindMap() {
      // 1. Compute Y positions
      const yOffset = { val: 0 };
      computeVerticalLayout(mindMapData, 0, yOffset);

      // Center layout vertically relative to origin
      const allVisible = flattenNodes(mindMapData);
      if (allVisible.length > 0) {
        const minY = Math.min(...allVisible.map(n => n.y));
        const maxY = Math.max(...allVisible.map(n => n.y));
        const midY = (minY + maxY) / 2;
        allVisible.forEach(n => n.y -= midY);
      }

      // 2. Initial pass node rendering (positioned vertically, temporary X=0)
      nodesContainer.innerHTML = '';
      svgPathsGroup.innerHTML = '';

      allVisible.forEach(node => {
        const hasChildren = node.children && node.children.length > 0;
        const isCollapsed = collapsedNodes.has(node.id);

        const el = document.createElement('div');
        el.className = `node node-level-${node.level} ${hasChildren ? 'has-children' : ''} ${isCollapsed ? 'collapsed' : ''}`;
        
        el.style.left = `0px`;
        el.style.top = `${node.y}px`;
        el.dataset.id = node.id;
        el.innerText = node.text;

        el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (hasChildren) {
            const wasCollapsed = collapsedNodes.has(node.id);
            if (wasCollapsed) {
              collapsedNodes.delete(node.id);
            } else {
              collapsedNodes.add(node.id);
            }
            renderMindMap();

            if (wasCollapsed) {
              panAndZoomToNodeBranchSmooth(node);
            } else {
              panAndZoomOnCollapseSmooth(node);
            }
          }
        });

        nodesContainer.appendChild(el);
        node.domEl = el;
      });

      // 3. Compute dynamic X positions based on measured DOM widths & position nodes/curves
      requestAnimationFrame(() => {
        computeHorizontalLayout(mindMapData, 0);

        allVisible.forEach(node => {
          if (node.domEl) {
            node.domEl.style.left = `${node.x}px`;
          }
        });

        allVisible.forEach(node => {
          const isCollapsed = collapsedNodes.has(node.id);
          if (!isCollapsed && node.children) {
            node.children.forEach(child => {
              if (allVisible.includes(child)) {
                drawCurvePath(node, child);
              }
            });
          }
        });

        if (isInitialLoad) {
          isInitialLoad = false;
          centerInitialView();
        }

        performSearchHighlight();
      });

      updateTransform();
    }

    function drawCurvePath(parent, child) {
      if (!parent.domEl || !child.domEl) return;

      const parentRect = parent.domEl.getBoundingClientRect();

      const startX = parent.x + (parentRect.width / scale);
      const startY = parent.y;
      
      const endX = child.x;
      const endY = child.y;

      const controlDist = Math.max(30, (endX - startX) * 0.5);

      const pathD = `M ${startX} ${startY} C ${startX + controlDist} ${startY}, ${endX - controlDist} ${endY}, ${endX} ${endY}`;
      
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pathD);
      path.setAttribute('class', 'connection-line');

      svgPathsGroup.appendChild(path);
    }

    function updateTransform(animated = false) {
      if (animated) {
        nodesContainer.classList.add('animated-transform');
        svgPathsGroup.classList.add('animated-transform');
        setTimeout(() => {
          nodesContainer.classList.remove('animated-transform');
          svgPathsGroup.classList.remove('animated-transform');
        }, 450);
      }
      
      nodesContainer.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      svgPathsGroup.setAttribute('transform', `translate(${translateX}, ${translateY}) scale(${scale})`);
    }

    // Smooth Animated Auto-Pan & Zoom when expanding a node branch
    function panAndZoomToNodeBranchSmooth(node) {
      setTimeout(() => {
        const branchNodes = flattenNodes(node);
        if (branchNodes.length <= 1) return;

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        branchNodes.forEach(n => {
          const w = n.domEl ? (n.domEl.getBoundingClientRect().width / scale) : 180;
          const h = 40;
          if (n.x < minX) minX = n.x;
          if (n.x + w > maxX) maxX = n.x + w;
          if (n.y - h/2 < minY) minY = n.y - h/2;
          if (n.y + h/2 > maxY) maxY = n.y + h/2;
        });

        if (node.x < minX) minX = node.x;

        const padding = 80;
        const availW = window.innerWidth - padding * 2;
        const availH = window.innerHeight - padding * 2;

        const branchW = maxX - minX;
        const branchH = maxY - minY;

        let neededScale = scale;
        if (branchW * scale > availW || branchH * scale > availH) {
          const scaleX = availW / branchW;
          const scaleY = availH / branchH;
          neededScale = Math.min(scaleX, scaleY);
          neededScale = Math.max(0.2, Math.min(neededScale, scale));
        }

        scale = neededScale;

        const targetMidX = (minX + maxX) / 2;
        const targetMidY = (minY + maxY) / 2;

        translateX = (window.innerWidth / 2) - (targetMidX * scale);
        translateY = (window.innerHeight / 2) - (targetMidY * scale);

        updateTransform(true);
      }, 50);
    }

    // Smooth Animated Auto-Pan & Zoom Correction when COLLAPSING a node branch
    function panAndZoomOnCollapseSmooth(collapsedNode) {
      setTimeout(() => {
        const allVisible = flattenNodes(mindMapData);
        if (allVisible.length === 0) return;

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        allVisible.forEach(n => {
          const w = n.domEl ? (n.domEl.getBoundingClientRect().width / scale) : 180;
          const h = 40;
          if (n.x < minX) minX = n.x;
          if (n.x + w > maxX) maxX = n.x + w;
          if (n.y - h/2 < minY) minY = n.y - h/2;
          if (n.y + h/2 > maxY) maxY = n.y + h/2;
        });

        const padding = 80;
        const availW = window.innerWidth - padding * 2;
        const availH = window.innerHeight - padding * 2;

        const contentW = maxX - minX;
        const contentH = maxY - minY;

        let newScale = scale;
        if (contentW * scale < availW * 0.5 && contentH * scale < availH * 0.5 && scale < 1.0) {
          const scaleX = availW * 0.75 / contentW;
          const scaleY = availH * 0.75 / contentH;
          newScale = Math.min(Math.min(scaleX, scaleY), 1.0);
        }

        scale = newScale;

        const targetX = collapsedNode ? collapsedNode.x : (minX + maxX) / 2;
        const targetY = collapsedNode ? collapsedNode.y : (minY + maxY) / 2;

        translateX = (window.innerWidth / 2) - (targetX * scale);
        translateY = (window.innerHeight / 2) - (targetY * scale);

        updateTransform(true);
      }, 50);
    }

    // --- VIEW CALCULATIONS & CENTERING ---
    function centerInitialView(animated = false) {
      const allVisible = flattenNodes(mindMapData);
      if (allVisible.length === 0) return;

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      allVisible.forEach(n => {
        const w = n.domEl ? (n.domEl.getBoundingClientRect().width / scale) : 180;
        if (n.x < minX) minX = n.x;
        if (n.x + w > maxX) maxX = n.x + w;
        if (n.y < minY) minY = n.y;
        if (n.y > maxY) maxY = n.y;
      });

      const viewW = window.innerWidth;
      const viewH = window.innerHeight;

      const contentW = maxX - minX;

      scale = 1.0;
      translateX = (viewW - contentW) / 2 - minX;
      translateY = viewH / 2;

      updateTransform(animated);
    }

    // Fit to window scales to fit the ENTIRE diagram in the window with no cutoff
    function fitToWindow(animated = true) {
      const allVisible = flattenNodes(mindMapData);
      if (allVisible.length === 0) return;

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      allVisible.forEach(n => {
        const w = n.domEl ? (n.domEl.getBoundingClientRect().width / scale) : 180;
        const h = 40;
        if (n.x < minX) minX = n.x;
        if (n.x + w > maxX) maxX = n.x + w;
        if (n.y - h/2 < minY) minY = n.y - h/2;
        if (n.y + h/2 > maxY) maxY = n.y + h/2;
      });

      const padding = 80;
      const availableW = window.innerWidth - (padding * 2);
      const availableH = window.innerHeight - (padding * 2);

      const contentW = maxX - minX;
      const contentH = maxY - minY;

      const scaleX = availableW / contentW;
      const scaleY = availableH / contentH;

      scale = Math.min(scaleX, scaleY);

      const midX = (minX + maxX) / 2;
      const midY = (minY + maxY) / 2;

      translateX = (window.innerWidth / 2) - (targetMidX = midX) * scale;
      translateX = (window.innerWidth / 2) - (midX * scale);
      translateY = (window.innerHeight / 2) - (midY * scale);

      updateTransform(animated);
    }

    function resetZoomToInitial() {
      collapsedNodes.clear();
      setInitialCollapsedState(mindMapData);
      renderMindMap();
      setTimeout(() => centerInitialView(true), 50);
    }

    // --- ULTRA-HIGH RESOLUTION PNG EXPORT (4X Crystal-Clear Vector Rendering) ---
    function downloadMindMapPNG() {
      const allVisible = flattenNodes(mindMapData);
      if (allVisible.length === 0) return;

      // Calculate absolute bounds of all visible nodes
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      allVisible.forEach(n => {
        const w = n.domEl ? (n.domEl.getBoundingClientRect().width / scale) : 200;
        const h = 46;
        if (n.x < minX) minX = n.x;
        if (n.x + w > maxX) maxX = n.x + w;
        if (n.y - h/2 < minY) minY = n.y - h/2;
        if (n.y + h/2 > maxY) maxY = n.y + h/2;
      });

      const padding = 100;
      const unscaledW = (maxX - minX) + (padding * 2);
      const unscaledH = (maxY - minY) + (padding * 2);

      // Render canvas at 4x resolution scale (dpr = 4) for vector-grade crispness
      const dpr = 4;
      const canvasW = Math.ceil(unscaledW * dpr);
      const canvasH = Math.ceil(unscaledH * dpr);

      const canvas = document.createElement('canvas');
      canvas.width = canvasW;
      canvas.height = canvasH;
      const ctx = canvas.getContext('2d');

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // 1. Draw clean background
      ctx.fillStyle = '#f7f9fc';
      ctx.fillRect(0, 0, canvasW, canvasH);

      // Scale canvas context to 4x supersampling
      ctx.scale(dpr, dpr);

      const offsetX = padding - minX;
      const offsetY = padding - minY;

      // 2. Draw SVG Connecting Lines onto Canvas
      allVisible.forEach(node => {
        const isCollapsed = collapsedNodes.has(node.id);
        if (!isCollapsed && node.children) {
          node.children.forEach(child => {
            if (allVisible.includes(child) && node.domEl && child.domEl) {
              const nodeWidth = node.domEl.getBoundingClientRect().width / scale;
              const sx = node.x + nodeWidth + offsetX;
              const sy = node.y + offsetY;
              const ex = child.x + offsetX;
              const ey = child.y + offsetY;
              const ctrl = Math.max(30, (ex - sx) * 0.5);

              ctx.beginPath();
              ctx.moveTo(sx, sy);
              ctx.bezierCurveTo(sx + ctrl, sy, ex - ctrl, ey, ex, ey);
              ctx.strokeStyle = '#8094ae';
              ctx.lineWidth = 2;
              ctx.stroke();
            }
          });
        }
      });

      // High contrast level color palette up to Level 10
      const levelColors = {
        0: { bg: '#b4acf0', text: '#1e1945', weight: '800', size: 15 },
        1: { bg: '#aebdf5', text: '#111a45', weight: '700', size: 14 },
        2: { bg: '#9fd4cb', text: '#082d28', weight: '600', size: 13.5 },
        3: { bg: '#aaeec0', text: '#09381b', weight: '600', size: 13.5 },
        4: { bg: '#c9f88c', text: '#1b3602', weight: '600', size: 13.5 },
        5: { bg: '#fde047', text: '#713f12', weight: '600', size: 13.5 },
        6: { bg: '#fdba74', text: '#7c2d12', weight: '600', size: 13.5 },
        7: { bg: '#fca5a5', text: '#7f1d1d', weight: '600', size: 13.5 },
        8: { bg: '#f472b6', text: '#831843', weight: '600', size: 13.5 },
        9: { bg: '#e879f9', text: '#701a75', weight: '600', size: 13.5 },
        10: { bg: '#c084fc', text: '#581c87', weight: '600', size: 13.5 }
      };

      // 3. Draw Pill Nodes onto 4x Canvas
      allVisible.forEach(node => {
        if (!node.domEl) return;
        const rect = node.domEl.getBoundingClientRect();
        const w = rect.width / scale;
        const h = rect.height / scale;
        const nx = node.x + offsetX;
        const ny = (node.y - (h / 2)) + offsetY;

        const styleConfig = levelColors[Math.min(node.level, 10)] || levelColors[10];

        // Draw pill background
        const radius = h / 2;
        ctx.beginPath();
        ctx.roundRect(nx, ny, w, h, radius);
        ctx.fillStyle = styleConfig.bg;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.08)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 2;
        ctx.fill();
        ctx.shadowColor = 'transparent';

        // Format pill text with indicators
        let displayText = node.text;
        const hasChildren = node.children && node.children.length > 0;
        const isCollapsed = collapsedNodes.has(node.id);
        if (hasChildren) {
          displayText += isCollapsed ? '  +' : '  −';
        }

        // Draw crystal-clear text on 4x supersampled canvas
        ctx.fillStyle = styleConfig.text;
        ctx.font = `${styleConfig.weight} ${styleConfig.size}px Inter, system-ui, sans-serif`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(displayText, nx + 18, ny + (h / 2));
      });

      // Format download filename as "Mind_Map_[topic].png"
      const rawTopic = document.getElementById('topic-title')?.innerText || mindMapData.text || 'Topic';
      const formattedTopic = rawTopic.trim().replace(/\s+/g, '_');
      const filename = `Mind_Map_${formattedTopic}.png`;

      // Trigger ultra-high resolution PNG download with formatted filename
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    }

    // --- PAN & ZOOM TOWARDS POINTER ---
    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.node') || e.target.closest('.floating-panel')) return;
      isDragging = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform(false);
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // Double-click in blank canvas space triggers Fit to Window
    viewport.addEventListener('dblclick', (e) => {
      if (e.target.closest('.node') || e.target.closest('.floating-panel')) return;
      fitToWindow(true);
    });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      const newScale = Math.min(Math.max(0.1, scale * zoomFactor), 2.5);

      translateX = mouseX - (mouseX - translateX) * (newScale / scale);
      translateY = mouseY - (mouseY - translateY) * (newScale / scale);

      scale = newScale;
      updateTransform(false);
    }, { passive: false });

    // --- BUTTON HANDLERS ---
    document.getElementById('btn-expand-all').addEventListener('click', () => {
      collapsedNodes.clear();
      renderMindMap();
      setTimeout(() => fitToWindow(true), 50);
    });

    document.getElementById('btn-collapse-all').addEventListener('click', () => {
      function collapseAll(node) {
        if (node.children && node.children.length > 0) {
          collapsedNodes.add(node.id);
          node.children.forEach(collapseAll);
        }
      }
      collapseAll(mindMapData);
      renderMindMap();
      setTimeout(() => centerInitialView(true), 50);
    });

    document.getElementById('zoom-fit-btn').addEventListener('click', () => fitToWindow(true));
    document.getElementById('zoom-reset').addEventListener('click', resetZoomToInitial);
    document.getElementById('download-png-btn').addEventListener('click', downloadMindMapPNG);

    document.getElementById('zoom-in').addEventListener('click', () => {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const newScale = Math.min(2.5, scale * 1.15);
      translateX = centerX - (centerX - translateX) * (newScale / scale);
      translateY = centerY - (centerY - translateY) * (newScale / scale);
      scale = newScale;
      updateTransform(true);
    });

    document.getElementById('zoom-out').addEventListener('click', () => {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const newScale = Math.max(0.1, scale * 0.85);
      translateX = centerX - (centerX - translateX) * (newScale / scale);
      translateY = centerY - (centerY - translateY) * (newScale / scale);
      scale = newScale;
      updateTransform(true);
    });

    // Recursively check if descendant node text matches search query
    function hasMatchingDescendant(node, query) {
      if (!node.children || node.children.length === 0) return false;
      for (let child of node.children) {
        if (child.text.toLowerCase().includes(query)) return true;
        if (hasMatchingDescendant(child, query)) return true;
      }
      return false;
    }

    // Perform Search & Highlight logic
    function performSearchHighlight() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const allVisible = flattenNodes(mindMapData);

      allVisible.forEach(node => {
        if (!node.domEl) return;
        node.domEl.classList.remove('highlighted', 'parent-match-highlighted');

        if (!query) return;

        const isExactMatch = node.text.toLowerCase().includes(query);
        const isCollapsed = collapsedNodes.has(node.id);
        const hasHiddenMatch = isCollapsed && hasMatchingDescendant(node, query);

        if (isExactMatch) {
          node.domEl.classList.add('highlighted');
        } else if (hasHiddenMatch) {
          node.domEl.classList.add('parent-match-highlighted');
        }
      });
    }

    document.getElementById('search-input').addEventListener('input', performSearchHighlight);

    // Initial Render & Dynamic Title Sync
    const titleEl = document.getElementById('topic-title');
    if (titleEl && mindMapData && mindMapData.text) {
      titleEl.textContent = mindMapData.text;
    }
    renderMindMap();
  </script>
</body>
