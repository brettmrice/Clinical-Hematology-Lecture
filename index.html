<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Clinical Hematology Lecture & Resource Explorer - Minimalist design inspired by mlsascp.com">
    <title>Clinical Hematology Explorer</title>
    
    <!-- Google Fonts: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Prevent automatic browser anchor scrolling on initial load -->
    <script>
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        if (window.location.hash) {
            window.scrollTo(0, 0);
        }
    </script>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="header-container">
            <a href="#" class="brand">
                <div class="brand-icon">CH</div>
                <div>
                    <div class="brand-title">Clinical Hematology</div>
                    <div class="brand-subtitle">Resource Explorer</div>
                </div>
            </a>
            
            <div class="header-actions">
                <button class="btn btn-icon-only" id="themeToggleBtn" aria-label="Toggle Dark Mode" title="Toggle Theme">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Controls Bar -->
    <div class="controls-bar">
        <!-- Search & View Toggle Row -->
        <div class="search-row">
            <div class="search-box">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Search mind maps, discussions, slides, or topics..." autocomplete="off">
            </div>

            <div class="view-toggle">
                <button class="toggle-btn active" id="btnViewGrid" title="Card Grid View">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                    </svg>
                    Grid
                </button>
                <button class="toggle-btn" id="btnViewTree" title="Directory Tree View">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                    </svg>
                    Tree
                </button>
            </div>
        </div>

        <!-- Section / Domain Selector Row -->
        <div class="sections-row">
            <button class="section-tab active" data-section="all" id="tabSectionAll">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                </svg>
                All Curriculum <span class="chip-count" id="countSectionAll">0</span>
            </button>
            <button class="section-tab" data-section="lecture" id="tabSectionLecture">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>
                Lectures <span class="chip-count" id="countSectionLecture">0</span>
            </button>
            <button class="section-tab" data-section="laboratory" id="tabSectionLab">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                </svg>
                Laboratory <span class="chip-count" id="countSectionLab">0</span>
            </button>
        </div>

        <!-- Filter Chips Row -->
        <div class="chips-row">
            <button class="chip active" data-filter="all">
                All Resources <span class="chip-count" id="countAll">0</span>
            </button>
            <button class="chip" data-filter="discussion">
                <svg width="14" height="14" viewBox="0 0 14 14" style="vertical-align: middle;"><circle cx="7" cy="7" r="6.5" fill="var(--accent-bg-doc)" stroke="var(--accent-doc)" stroke-width="1"/><circle cx="7" cy="7" r="3" fill="var(--accent-doc)"/></svg>
                Discussions <span class="chip-count" id="countDisc">0</span>
            </button>
            <button class="chip" data-filter="pdf">
                <svg width="14" height="14" viewBox="0 0 14 14" style="vertical-align: middle;"><circle cx="7" cy="7" r="6.5" fill="var(--accent-bg-pdf)" stroke="var(--accent-pdf)" stroke-width="1"/><circle cx="7" cy="7" r="3" fill="var(--accent-pdf)"/></svg>
                Slide Decks <span class="chip-count" id="countPdf">0</span>
            </button>
            <button class="chip" data-filter="video">
                <svg width="14" height="14" viewBox="0 0 14 14" style="vertical-align: middle;"><circle cx="7" cy="7" r="6.5" fill="var(--accent-bg-video)" stroke="var(--accent-video)" stroke-width="1"/><circle cx="7" cy="7" r="3" fill="var(--accent-video)"/></svg>
                Videos <span class="chip-count" id="countVideo">0</span>
            </button>
            <button class="chip" data-filter="demonstration">
                <svg width="14" height="14" viewBox="0 0 14 14" style="vertical-align: middle;"><circle cx="7" cy="7" r="6.5" fill="var(--accent-bg-demo)" stroke="var(--accent-demo)" stroke-width="1"/><circle cx="7" cy="7" r="3" fill="var(--accent-demo)"/></svg>
                Demonstrations <span class="chip-count" id="countDemo">0</span>
            </button>
            <button class="chip" data-filter="tool">
                <svg width="14" height="14" viewBox="0 0 14 14" style="vertical-align: middle;"><circle cx="7" cy="7" r="6.5" fill="var(--accent-bg-tool)" stroke="var(--accent-tool)" stroke-width="1"/><circle cx="7" cy="7" r="3" fill="var(--accent-tool)"/></svg>
                Tools <span class="chip-count" id="countTool">0</span>
            </button>
            <button class="chip" data-filter="mindmap">
                <svg width="14" height="14" viewBox="0 0 14 14" style="vertical-align: middle;"><circle cx="7" cy="7" r="6.5" fill="var(--accent-bg-map)" stroke="var(--accent-map)" stroke-width="1"/><circle cx="7" cy="7" r="3" fill="var(--accent-map)"/></svg>
                Mind Maps <span class="chip-count" id="countMaps">0</span>
            </button>
        </div>
    </div>

    <!-- Main Content Area -->
    <main>
        <div class="results-stats" id="resultsStats">Loading files index...</div>
        <div id="contentContainer">
            <!-- Dynamic files grid or tree rendered by app.js -->
        </div>
    </main>

    <!-- Modal Drawer Previewer -->
    <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Document Preview</div>
                <div class="modal-controls">
                    <a class="btn btn-primary" id="modalExternalLink" href="#" target="_blank" rel="noopener noreferrer" style="padding: 6px 12px; font-size: 0.8rem;">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                        </svg>
                        Open in New Tab
                    </a>
                    <button class="btn btn-icon-only" id="modalCloseBtn" aria-label="Close modal" style="background: rgba(255,255,255,0.15); color: #FFF; border: none;">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="modal-body">
                <iframe id="modalIframe" src="about:blank" title="Resource Preview"></iframe>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Footer -->
    <footer>
        <p>Clinical Hematology Resource Explorer</p>
    </footer>

    <!-- Application Manifest & Scripts -->
    <script src="files_data.js"></script>
    <script src="video_links.js"></script>
    <script src="app.js"></script>
</body>
</html>
